# Refreshes the orbital-element snapshot in public/data/tle/ every 6 hours.
# The app reads this same-origin snapshot first, so it works even if CelesTrak
# blocks cross-origin browser requests. See docs/DECISIONS.md D-004.
name: Update TLE snapshot

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # needed to start the deploy workflow below

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-tle.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/tle
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: refresh TLE snapshot"
            git push
            # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
